# FinAI local infrastructure.
# Phase 1 runs happily against SQLite for development; this compose file
# provisions the production-shaped stack (PostgreSQL + Redis) and containers.
#
#   docker compose up postgres          - just the database
#   docker compose up --build           - full stack (API + web + postgres)
#
# Redis is provisioned for Phase 2+ (caching, background jobs). It is not
# consumed by Phase 1 services yet.
#
# Every service uses restart: unless-stopped, so the stack comes back on its
# own after a reboot (as long as Docker Desktop is running) — until you stop
# it with STOP-FINAI.bat / docker compose down.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: finai
      POSTGRES_DB: finai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://finai:finai@postgres:5432/finai
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENV: production
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
